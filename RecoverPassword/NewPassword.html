<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oyasumi's First Portfolio Website">
    <meta name="keywords" content="portfolio, web development, FrontEnd, Front-End, CSS, Oyasumi">
    <meta name="author" content="Oyasumi">
    <link rel="stylesheet" href="PassResetStyle.css">
    <title>New Password</title>
</head>

<body class="BodyReset">
    <main class="Container">

        <form>
            <div class="CodeSection">

                <h1>New Password</h1>
                <p>Enter your new password below.</p>

                <div class="InputBox">
                    <input name="password" placeholder="Password" type="password" required maxlength="36" class="InputPadding">
                </div>
                <div class="InputBox">
                    <input name="confirm_password" placeholder="Confirm Password" type="password" required maxlength="36" class="InputPadding">
                </div>
            </div>

            </div>

            <button class="VerifyButton" type="submit">Update Password</button>

            <div class="Cancel">
                <div><a href="/LoginRegister/Login.html" class="CancelButton">Cancel</a></div>
            </div>

        </form>

    </main>

</body>

</html>
